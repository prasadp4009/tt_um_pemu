<text x="130.0" y="950.7888" font-size="11" fill="#0f172a" text-anchor="start" font-weight="normal" >Placement interleaves blocks, so regions overlap — the overlap is real. Pin ticks: all 45 Metal4.text anchors from layers.json.</text>
