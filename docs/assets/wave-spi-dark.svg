<text x="490" y="302" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="normal" >SCLK period 50 cycles x14, zero deviation; byte-boundary period 58 cycles; duty 25/25.</text>
<text x="490" y="324" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Loopback demo: MOSI 0xA5 -&gt; MISO 0x5A, 0x3C -&gt; 0xC3. CS# brackets SCLK. N=0: 3-cycle pulse, no SCLK.</text>
