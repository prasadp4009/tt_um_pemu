</defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="490" y="30" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold" >SPI master, mode 0 — 50 cycles/bit, 408 cycles/byte (schematic)</text>
<rect x="430" y="42" width="120" height="4" rx="2" fill="url(#gradCopper)"/>
<text x="122" y="87" font-size="12" fill="#e2e8f0" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">CS#</text>
<polyline points="130,70 198,70 198,96 810,96 810,70 878,70" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="122" y="139" font-size="12" fill="#e2e8f0" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">SCLK</text>
<polyline points="130,148 198,148 198,122 266,122 266,148 334,148 334,122 402,122 402,148 470,148 470,122 538,122 538,148 606,148 606,122 674,122 674,148 742,148 742,122 810,122 810,148 878,148" fill="none" stroke="#60a5fa" stroke-width="2"/>
<text x="122" y="191" font-size="12" fill="#e2e8f0" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">MOSI</text>
<polyline points="130,200 198,200 198,174 266,174 266,200 334,200 334,174 402,174 402,200 538,200 538,174 674,174 674,200 742,200 742,174 810,174 810,200 878,200" fill="none" stroke="#34d399" stroke-width="2"/>
<text x="122" y="243" font-size="12" fill="#e2e8f0" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">MISO</text>
