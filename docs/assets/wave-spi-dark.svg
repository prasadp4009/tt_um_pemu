<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="SPI master, mode 0 — 50 cycles/bit, 408 cycles/byte (schematic)">
<title>SPI master, mode 0 — 50 cycles/bit, 408 cycles/byte (schematic)</title>
<defs>
