<text x="390" y="320" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" >PGET sample point
(mid-bit, +2-cycle sync accounted)</text>
<text x="490" y="360" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal" >Rules: pin effect of an instruction lands on its own cycle grid; PGET reads the 2-FF-synchronized pins;</text>
<text x="490" y="385" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal" >WAIT exits on the condition cycle (elapsed = timeout counts as satisfied, no TIMEOUT) or on timeout (TIMEOUT set);</text>
<text x="490" y="405" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal" >SLEEP is exactly 1 + imm13 cycles; HLT gates PE clocks (Observer and timestamp keep running).</text>
