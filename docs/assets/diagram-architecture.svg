<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Tarang system architecture">
<title>Tarang system architecture</title>
<defs>
<linearGradient id="gradCopper" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#fffdf9"/>
<text x="490" y="30" font-size="17" fill="#1c1917" text-anchor="middle" font-weight="bold" >Tarang system architecture — one die, two independent engines</text>
<rect x="430" y="42" width="120" height="4" rx="2" fill="url(#gradCopper)"/>
<rect x="60" y="80" width="300" height="170" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="210" y="106" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" >PE core — Tarang-32 engine</text>
<text x="210" y="130" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >timed ISA · 16 x 16-bit GPRs</text>
<text x="210" y="150" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >WAIT returns elapsed cycles</text>
<text x="210" y="170" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >CAP snapshots {timestamp, pins}</text>
<text x="210" y="190" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >ALU · CALL/RET · 9-bit PC (v0.3)</text>
<text x="210" y="216" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >drives PIN0–PIN7 via pin fabric</text>
<rect x="60" y="290" width="300" height="150" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="210" y="316" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" >Observer — trace engine</text>
<text x="210" y="340" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >watches the same 8 pins</text>
<text x="210" y="360" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >32-bit cycle timestamps</text>
<text x="210" y="380" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >EDGE / PATTERN / PULSE triggers</text>
<text x="210" y="400" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >204-entry trace SRAM — PE cannot read it</text>
<rect x="620" y="80" width="300" height="170" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="770" y="106" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" >Host port</text>
<text x="770" y="130" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >2-wire framed serial · autobaud</text>
<text x="770" y="150" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >ui[0] = HP_RX · uo[0] = HP_TX</text>
<text x="770" y="170" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >LOAD / VERIFY / GO / RD_TRACE</text>
<text x="770" y="190" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >TX + RX FIFOs, 16 x 16-bit each</text>
<text x="770" y="216" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >RD_STATUS · HALT_REQ · WR_CFG</text>
<rect x="620" y="290" width="300" height="150" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="770" y="316" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" >Pin fabric (top level)</text>
<text x="770" y="340" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >per-pin direction (PDIR)</text>
<text x="770" y="360" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >open-drain + pull-up (PMODE)</text>
<text x="770" y="380" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >2-FF input synchronizer</text>
<text x="770" y="400" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >uio[0..7] = PIN0–PIN7</text>
<rect x="400" y="130" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="490" y="156" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, monospace">u_imem</text>
<text x="490" y="176" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >512 x 32-bit</text>
<rect x="400" y="320" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="490" y="346" font-size="14" fill="#1c1917" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, monospace">u_tmem</text>
<text x="490" y="366" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >1024 x 8-bit</text>
<line x1="400" y1="165" x2="360" y2="165" stroke="#334155" stroke-width="1.6" />
<line x1="360" y1="165" x2="368.6" y2="167.8" stroke="#334155" stroke-width="1.6"/>
<line x1="360" y1="165" x2="368.6" y2="162.2" stroke="#334155" stroke-width="1.6"/>
<line x1="360" y1="355" x2="400" y2="355" stroke="#047857" stroke-width="1.6" />
<line x1="400" y1="355" x2="391.4" y2="352.2" stroke="#047857" stroke-width="1.6"/>
<line x1="400" y1="355" x2="391.4" y2="357.8" stroke="#047857" stroke-width="1.6"/>
<line x1="620" y1="165" x2="580" y2="165" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="580" y1="165" x2="588.6" y2="167.8" stroke="#334155" stroke-width="1.6"/>
<line x1="580" y1="165" x2="588.6" y2="162.2" stroke="#334155" stroke-width="1.6"/>
<text x="490" y="480" font-size="13" fill="#1c1917" text-anchor="middle" font-weight="bold" >Structural invariant: the PE has no data path to the trace SRAM.</text>
<text x="490" y="502" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >The Observer can therefore characterize the bus — including the PE's own output.</text>
<text x="490" y="530" font-size="12" fill="#1c1917" text-anchor="middle" font-weight="normal" >Firmware (not gates) decides the protocol: UART · SPI · I2C · 1-Wire · JTAG · SWD · PS/2 · CAN · USB LS.</text>
</svg>
