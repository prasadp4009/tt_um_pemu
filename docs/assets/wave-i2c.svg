<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="I2C master 100 kHz — nominal 500 cycles/bit, measured 499 (schematic)">
<title>I2C master 100 kHz — nominal 500 cycles/bit, measured 499 (schematic)</title>
<defs>
<linearGradient id="gradCopper" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#fffdf9"/>
<text x="490" y="30" font-size="16" fill="#1c1917" text-anchor="middle" font-weight="bold" >I2C master 100 kHz — nominal 500 cycles/bit, measured 499 (schematic)</text>
<rect x="430" y="42" width="120" height="4" rx="2" fill="url(#gradCopper)"/>
<text x="122" y="87" font-size="12" fill="#1c1917" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">SCL</text>
<polyline points="130,70 232,70 232,96 334,96 334,70 436,70 436,96 538,96 538,70 640,70 640,96 742,96 742,70 878,70" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="122" y="139" font-size="12" fill="#1c1917" text-anchor="end" font-weight="normal" font-family="DejaVu Sans Mono, monospace">SDA</text>
<polyline points="130,122 198,122 198,148 402,148 402,122 538,122 538,148 674,148 674,122 878,122" fill="none" stroke="#047857" stroke-width="2"/>
<text x="490" y="198" font-size="12" fill="#57534e" text-anchor="middle" font-weight="normal" >73 data clocks at exactly 499 cycles (= 100.2 kHz); high 248 / low 251 cycles.</text>
<text x="490" y="220" font-size="12" fill="#57534e" text-anchor="middle" font-weight="normal" >Clock stretch 2000 cycles tolerated (WAIT 2001 &lt; 4096 timeout, no abort).</text>
<text x="490" y="242" font-size="12" fill="#57534e" text-anchor="middle" font-weight="normal" >NACK-on-address -&gt; 0xFFE0 + STOP + EVT1. Spec gates pass on all 92 highs / 90 lows.</text>
</svg>
